<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypeMaster — Übungsauswahl</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .filter-bar { display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap; }
    .fbtn {
      padding:6px 16px; border-radius:20px; font-size:12px; font-weight:500;
      border:1px solid var(--b); background:transparent; color:var(--t2);
      cursor:pointer; transition:all var(--tr); letter-spacing:.02em;
    }
    .fbtn:hover { border-color:var(--bh); color:var(--t); }
    .fbtn.active { background:var(--bg3); border-color:var(--bh); color:var(--t); }
    .ex-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; margin-bottom:32px; }
    .ex-card {
      background:var(--bg1); border:1px solid var(--b); border-radius:var(--r);
      padding:20px; cursor:pointer; transition:border-color var(--tr),background var(--tr);
      user-select:none; position:relative;
    }
    .ex-card:hover { border-color:var(--bh); background:var(--bg2); }
    .ex-card.selected { border-color:var(--green); background:var(--bg2); }
    .ex-card.selected::after {
      content:'✓'; position:absolute; top:14px; right:16px;
      width:20px; height:20px; border-radius:50%; background:var(--green);
      color:#0a0a0a; font-size:11px; font-weight:700;
      display:flex; align-items:center; justify-content:center;
    }
    .badge {
      display:inline-block; font-size:10px; font-weight:600;
      letter-spacing:.08em; padding:3px 9px; border-radius:20px;
      text-transform:uppercase; margin-bottom:10px;
    }
    .badge-easy   { background:#0d2918; color:#3ecf8e; }
    .badge-medium { background:#2a1e06; color:#f59e0b; }
    .badge-hard   { background:#2a0d0d; color:#f05252; }
    .ex-title { font-size:15px; font-weight:600; color:var(--t); margin-bottom:5px; padding-right:24px; }
    .ex-desc  { font-size:12px; color:var(--t2); line-height:1.5; margin-bottom:14px; }
    .ex-meta  { display:flex; gap:16px; font-size:11px; color:var(--t3); }
    .ex-preview {
      margin-top:12px; padding-top:12px; border-top:1px solid var(--b);
      font-family:var(--mono); font-size:11px; color:var(--t3);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .bottom-bar {
      position:sticky; bottom:0; background:var(--bg);
      border-top:1px solid var(--b); padding:14px 28px;
      display:flex; align-items:center; justify-content:space-between; gap:16px;
    }
    .sel-info { font-size:13px; color:var(--t2); }
    .sel-info strong { color:var(--t); }
    .btn-start {
      padding:11px 28px; background:var(--t); color:var(--bg);
      border-radius:var(--rs); font-size:13px; font-weight:600;
      letter-spacing:.04em; border:none; cursor:pointer;
      transition:background var(--tr); min-width:130px;
    }
    .btn-start:hover { background:#c8c8c8; }
    .btn-start:active { transform:scale(.98); }
    .btn-start:disabled { opacity:.35; cursor:default; }
  </style>
</head>
<body>

<div style="max-width:860px;margin:0 auto;padding:0 28px 140px;">
  <nav class="topnav">
    <div class="logo">type<em>master</em></div>
    <div class="nav-hint">wählen · ↵ starten</div>
  </nav>
  <h1 class="page-title">Übungen</h1>
  <p class="page-sub">Wähle eine Übung und verbessere deine Tipp-Geschwindigkeit.</p>
  <div class="filter-bar">
    <button class="fbtn active" data-filter="all">Alle</button>
    <button class="fbtn" data-filter="easy">Einfach</button>
    <button class="fbtn" data-filter="medium">Mittel</button>
    <button class="fbtn" data-filter="hard">Schwer</button>
  </div>
  <div class="ex-grid" id="ex-grid"></div>
</div>

<div class="bottom-bar">
  <div class="sel-info" id="sel-info">Keine Übung ausgewählt</div>
  <button class="btn-start" id="btn-start" disabled>Starten →</button>
</div>

<script>
const EXERCISES = [
  { id:1, title:"Grundlagen", description:"Einfache Sätze für Einsteiger. Nur Kleinbuchstaben.", level:"easy", time:60,
    text:"die katze sitzt auf der matte und schläft tief und fest die sonne scheint durch das fenster und wärmt den raum" },
  { id:2, title:"Sätze & Großschreibung", description:"Deutsche Sätze mit Groß- und Kleinschreibung.", level:"easy", time:75,
    text:"Der schnelle braune Fuchs springt über den faulen Hund. Morgen wird das Wetter besser. Wir treffen uns am Bahnhof." },
  { id:3, title:"Zahlen & Sonderzeichen", description:"Ziffern, Klammern, Punkte und Sonderzeichen.", level:"medium", time:90,
    text:"Im Jahr 2024 kostet das Ticket 14,50 Euro. Ruf uns an: +49 (0)89 123-456! Bestellung #7821 vom 03.11.2024." },
  { id:4, title:"Zitat des Tages", description:"Ein inspirierendes Zitat präzise abtippen.", level:"medium", time:75,
    text:"Der Weg ist das Ziel. Wer aufhört besser zu werden, hat aufgehört gut zu sein. Übung macht den Meister." },
  { id:5, title:"Programmier-Code", description:"JavaScript-Syntax mit Klammern und Sonderzeichen.", level:"hard", time:120,
    text:"const greet = (name) => { return 'Hallo, ' + name + '!'; }; const nums = [1, 2, 3].filter(n => n > 1); console.log(greet('Welt'));" }
];

let selectedId = null;
let activeFilter = 'all';

function renderGrid() {
  const grid = document.getElementById('ex-grid');
  const list = activeFilter === 'all' ? EXERCISES : EXERCISES.filter(e => e.level === activeFilter);
  if (!list.length) { grid.innerHTML = '<p style="color:var(--t3);padding:20px 0;font-size:14px;">Keine Übungen.</p>'; return; }
  grid.innerHTML = list.map(ex => `
    <div class="ex-card ${ex.id === selectedId ? 'selected' : ''}" data-id="${ex.id}" tabindex="0" role="button">
      <span class="badge badge-${ex.level}">${ex.level==='easy'?'Einfach':ex.level==='medium'?'Mittel':'Schwer'}</span>
      <div class="ex-title">${ex.title}</div>
      <div class="ex-desc">${ex.description}</div>
      <div class="ex-meta"><span>⏱ ${ex.time}s</span><span>⌨ ${ex.text.length} Zeichen</span></div>
      <div class="ex-preview">${ex.text.substring(0,55)}…</div>
    </div>`).join('');
  grid.querySelectorAll('.ex-card').forEach(c => {
    c.addEventListener('click', () => selectEx(+c.dataset.id));
    c.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') selectEx(+c.dataset.id); });
  });
}

function selectEx(id) {
  selectedId = id;
  const ex = EXERCISES.find(e => e.id === id);
  document.getElementById('btn-start').disabled = false;
  document.getElementById('sel-info').innerHTML = `<strong>${ex.title}</strong> — ${ex.time}s · ${ex.text.length} Zeichen`;
  renderGrid();
}

document.querySelectorAll('.fbtn').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.fbtn').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); activeFilter = b.dataset.filter; renderGrid();
}));

document.getElementById('btn-start').addEventListener('click', () => {
  if (selectedId === null) return;
  sessionStorage.setItem('tm_exercise', JSON.stringify(EXERCISES.find(e => e.id === selectedId)));
  window.location.href = 'type.html';
});

document.addEventListener('keydown', e => { if (e.key==='Enter' && selectedId!==null) document.getElementById('btn-start').click(); });

renderGrid();
</script>
</body>
</html>
